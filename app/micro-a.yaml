apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-a
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-a
  template:
    metadata:
      labels:
        app: micro-a
    spec:
      serviceAccountName: micro-a
      containers:
      - name: micro-a
        image: roko1987/micro-a
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
        env:
        - name: MICRO_B_URL
          value: http://micro-b:8443
---
apiVersion: v1
kind: Service
metadata:
  name: micro-a
  namespace: demo
spec:
  selector:
    app: micro-a
  ports:
  - port: 8443
    targetPort: 8443