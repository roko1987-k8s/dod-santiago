apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-b
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-b
  template:
    metadata:
      labels:
        app: micro-b
    spec:
      serviceAccountName: micro-b
      containers:
      - name: micro-b
        image: roko1987/micro-b
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
        env:
        - name: MICRO_C_URL
          value: http://micro-c:8443
---
apiVersion: v1
kind: Service
metadata:
  name: micro-b
  namespace: demo
spec:
  selector:
    app: micro-b
  ports:
  - port: 8443
    targetPort: 8443
