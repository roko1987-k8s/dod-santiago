apiVersion: apps/v1
kind: Deployment
metadata:
  name: micro-c
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: micro-c
  template:
    metadata:
      labels:
        app: micro-c
    spec:
      serviceAccountName: micro-a
      containers:
      - name: micro-c
        image: roko1987/micro-c
        imagePullPolicy: Always
        ports:
        - containerPort: 8443
        env:
        - name: DELAY_SECONDS
          value: "0"
---
apiVersion: v1
kind: Service
metadata:
  name: micro-c
  namespace: demo
spec:
  selector:
    app: micro-c
  ports:
  - port: 8443
    targetPort: 8443